name: Daily Automated Leads Harvester

on:
  schedule:
    # Runs every day at 03:00 UTC (8:30 AM Indian Standard Time)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  harvest-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Run Daily Lead Harvester
        run: |
          python auto_daily_harvester.py

      - name: Commit and Push Updated Leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily Automated Leads Update [$(date +'%Y-%m-%d')]" && git push origin main)
